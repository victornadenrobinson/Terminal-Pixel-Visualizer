name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[ase,dev]'
      - run: ruff format --check src examples/toy_live.py tests
      - run: ruff check src examples/toy_live.py tests
      - run: mypy src
      - run: pytest
