name: Bug report
description: Report incorrect behaviour
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python version, terminal and termview version
