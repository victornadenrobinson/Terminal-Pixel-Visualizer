[build-system]
requires = ["setuptools>=78.1.1", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-pixel-visualizer"
version = "0.1.0"
description = "Terminal-only molecular and data visualizations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]
readme = "README.md"
license = "MIT"

[project.optional-dependencies]
ase = ["ase>=3.22"]
dev = ["ruff>=0.11.13", "mypy>=1.15", "pytest>=8.3"]

[project.scripts]
termview = "termview.cli:main"
termplot = "termview.plot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
