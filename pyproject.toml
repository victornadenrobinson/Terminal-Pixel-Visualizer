[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-pixel-visualizer"
version = "0.1.0"
description = "Terminal-only molecular and data visualizations"
requires-python = ">=3.9"
dependencies = ["numpy", "ase"]

[project.scripts]
termview = "termview:main"
termplot = "termplot:main"
toy-live = "toy_live:main"

[tool.setuptools]
py-modules = ["mdview", "mdview_lit", "termctl", "termplot", "termview", "toy_live"]
